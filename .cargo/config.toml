[unstable]
build-std = ["core", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]

[build]
target = "x86_64-hackers_os.json"

[target.'cfg(target_os = "none")']
runner = "bootimage runner"

[env]
# Point to the LLVM tools from Homebrew
LLVM_TOOLS_PATH = { value = "/opt/homebrew/opt/llvm/bin", force = true }