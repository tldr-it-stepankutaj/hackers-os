name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            cmake make \
            mtools dosfstools \
            qemu-system-aarch64 \
            xorriso \
            curl wget zip

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Checkout companion repos
        run: |
          cd ..
          git clone https://github.com/tldr-it-stepankutaj/dnsutils.git 2>/dev/null || true
          git clone https://github.com/tldr-it-stepankutaj/network-scanner.git 2>/dev/null || true
          git clone https://github.com/tldr-it-stepankutaj/jwt_inspector.git 2>/dev/null || true

      - name: Build kernel
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=aarch64-toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel $(nproc)

      - name: Verify kernel
        run: |
          file build/kernel.bin
          file build/kernel8.img
          ls -lh build/kernel.bin build/kernel8.img build/kernel.elf

      - name: Build companion apps
        run: |
          # dnsutils (Go)
          if [ -d "../dnsutils" ]; then
            cd ../dnsutils
            CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
              go build -ldflags='-s -w' -o ../hackers-os/apps/securitydns ./cmd/main.go
            cd ../hackers-os
          fi

          # C++ apps need static OpenSSL + libcurl — build them
          ./scripts/build-apps.sh || true

      - name: Create FAT32 disk image
        run: |
          DISK=hackers-os-disk.img
          dd if=/dev/zero of=$DISK bs=1M count=64
          mkfs.fat -F 32 -n HACKEROS $DISK

          # Copy test programs
          if [ -d tests ]; then
            cd tests
            aarch64-linux-gnu-gcc -static -nostdlib -o hello hello.S 2>/dev/null || true
            aarch64-linux-gnu-gcc -static -nostdlib -o sysinfo sysinfo.S 2>/dev/null || true
            [ -f hello ] && mcopy -i ../$DISK hello ::hello
            [ -f sysinfo ] && mcopy -i ../$DISK sysinfo ::sysinfo
            cd ..
          fi

          # Copy companion apps
          for app in apps/*; do
            [ -f "$app" ] || continue
            name=$(basename "$app")
            mcopy -i $DISK "$app" "::$name" 2>/dev/null || true
          done

          # Welcome file
          echo "Welcome to HackersOS!" > /tmp/welcome.txt
          echo "Type 'help' for commands." >> /tmp/welcome.txt
          echo "" >> /tmp/welcome.txt
          echo "Developed by TLDR;IT" >> /tmp/welcome.txt
          echo "https://www.tldr-it.com" >> /tmp/welcome.txt
          mcopy -i $DISK /tmp/welcome.txt ::welcome.txt

      - name: Create bootable ISO
        run: |
          ./scripts/make-iso.sh
          [ -f build/hackers-os.iso ] && cp build/hackers-os.iso .

      - name: Create QEMU package
        run: |
          mkdir -p hackers-os-qemu
          cp build/kernel.bin hackers-os-qemu/
          cp build/kernel.elf hackers-os-qemu/
          [ -f hackers-os-disk.img ] && cp hackers-os-disk.img hackers-os-qemu/disk.img

          cat > hackers-os-qemu/run.sh << 'RUNEOF'
          #!/bin/bash
          # HackersOS QEMU launcher
          SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
          KERNEL="$SCRIPT_DIR/kernel.bin"
          ARGS=(-M virt -cpu cortex-a72 -m 256M -nographic -kernel "$KERNEL")

          if [[ "$*" == *"--disk"* ]] && [ -f "$SCRIPT_DIR/disk.img" ]; then
            ARGS+=(-drive "file=$SCRIPT_DIR/disk.img,if=none,format=raw,id=hd0" -device virtio-blk-device,drive=hd0)
          fi
          if [[ "$*" == *"--net"* ]]; then
            ARGS+=(-device virtio-net-device,netdev=net0 -netdev user,id=net0)
          fi
          if [[ "$*" == *"--debug"* ]]; then
            ARGS+=(-s -S)
            echo "GDB server on :1234. Connect with: aarch64-linux-gnu-gdb -ex 'target remote :1234' kernel.elf"
          fi

          exec qemu-system-aarch64 "${ARGS[@]}"
          RUNEOF
          chmod +x hackers-os-qemu/run.sh

          cat > hackers-os-qemu/README.txt << 'EOF'
          HackersOS - AArch64 Bare-Metal Kernel
          ======================================

          Quick start:
            ./run.sh                    Basic boot (serial console)
            ./run.sh --disk             With FAT32 disk image
            ./run.sh --disk --net       With disk + networking
            ./run.sh --debug            GDB debug mode

          Requirements: qemu-system-aarch64

          https://www.tldr-it.com
          EOF

          tar czf hackers-os-qemu.tar.gz hackers-os-qemu/

      - name: Create Raspberry Pi SD card package
        run: |
          mkdir -p hackers-os-rpi-sdcard

          # Kernel
          cp build/kernel8.img hackers-os-rpi-sdcard/

          # config.txt
          cat > hackers-os-rpi-sdcard/config.txt << 'EOF'
          # HackersOS Raspberry Pi Configuration
          arm_64bit=1
          kernel=kernel8.img
          enable_uart=1
          gpu_mem=16
          dtoverlay=disable-bt
          EOF

          # Download RPi firmware files
          FIRMWARE_URL="https://github.com/raspberrypi/firmware/raw/master/boot"
          wget -q "$FIRMWARE_URL/bootcode.bin" -O hackers-os-rpi-sdcard/bootcode.bin || true
          wget -q "$FIRMWARE_URL/start.elf" -O hackers-os-rpi-sdcard/start.elf || true
          wget -q "$FIRMWARE_URL/fixup.dat" -O hackers-os-rpi-sdcard/fixup.dat || true

          # README
          cat > hackers-os-rpi-sdcard/README.txt << 'EOF'
          HackersOS - Raspberry Pi SD Card
          =================================

          1. Format SD card as FAT32
          2. Copy ALL files from this archive to the SD card root
          3. Connect USB-to-serial adapter:
             - GPIO 14 (pin 8)  = TX
             - GPIO 15 (pin 10) = RX
             - GND (pin 6)
          4. Open serial terminal at 115200 baud (8N1)
          5. Power on the Raspberry Pi

          Supported: Raspberry Pi 3, 3B+, 4, 400, 5

          https://www.tldr-it.com
          EOF

          cd hackers-os-rpi-sdcard
          zip -r ../hackers-os-rpi-sdcard.zip .
          cd ..

      - name: Boot test in QEMU
        run: |
          # Quick sanity test: boot kernel for 3 seconds
          timeout 5 qemu-system-aarch64 \
            -M virt -cpu cortex-a72 -m 256M \
            -display none -serial file:/tmp/boot-test.log \
            -kernel build/kernel.bin || true

          if [ -s /tmp/boot-test.log ]; then
            echo "=== Boot output ==="
            head -30 /tmp/boot-test.log
          else
            echo "Boot test: kernel built successfully (serial capture not available in CI)"
          fi

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "HackersOS ${{ github.ref_name }}"
          body: |
            ## HackersOS ${{ github.ref_name }}

            AArch64 bare-metal operating system kernel.

            ### Downloads

            | File | Description |
            |------|-------------|
            | `hackers-os.iso` | Bootable UEFI ISO (GRUB ARM64 EFI) |
            | `hackers-os-qemu.tar.gz` | QEMU package (kernel + run script + disk image) |
            | `hackers-os-rpi-sdcard.zip` | Raspberry Pi SD card (extract to FAT32 SD card, boot) |
            | `hackers-os-disk.img` | FAT32 disk image with bundled apps |
            | `kernel.bin` | Raw kernel binary |
            | `kernel8.img` | Raspberry Pi kernel image |
            | `kernel.elf` | ELF with debug symbols |

            ### Quick Start

            **QEMU:**
            ```bash
            tar xzf hackers-os-qemu.tar.gz && cd hackers-os-qemu && ./run.sh
            ```

            **Raspberry Pi:**
            1. Format SD card as FAT32
            2. Extract `hackers-os-rpi-sdcard.zip` to SD card
            3. Serial console at 115200 baud

            Developed by [TLDR;IT](https://www.tldr-it.com)
          files: |
            hackers-os.iso
            hackers-os-qemu.tar.gz
            hackers-os-rpi-sdcard.zip
            hackers-os-disk.img
            build/kernel.bin
            build/kernel8.img
            build/kernel.elf
          draft: false
          prerelease: false

      - name: Upload artifacts (non-tag builds)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: hackers-os-build
          path: |
            build/kernel.bin
            build/kernel8.img
            build/kernel.elf
            hackers-os.iso
            hackers-os-qemu.tar.gz
            hackers-os-rpi-sdcard.zip
            hackers-os-disk.img
